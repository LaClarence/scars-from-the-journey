<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Simple JSF Facelets page</title>
</h:head>
<h:body>
    <f:metadata>
        <f:viewAction action="#{personController.search}"/>
    </f:metadata>
    <h:form>
        <p:panel header="People Search">
            <p:fieldset>
                <h:panelGrid columns="3">
                    <p:outputLabel for="name" value="Name:"/>
                    <p:inputText id="name" value="#{personController.form.name}"/>
                    <p:message for="name"/>
                    <p:outputLabel for="surname" value="Surname:"/>
                    <p:inputText id="surname" value="#{personController.form.surname}"/>
                    <p:message for="surname"/>
                    <h:panelGroup/>
                    <p:commandButton value="Search" action="#{personController.search}" process="@form" update="peopleTable"/>
                </h:panelGrid>
            </p:fieldset>
            <p:spacer/>
            <p:fieldset>
                <p:dataTable id="peopleTable" var="p" value="#{personController.results}">
                    <p:column headerText="Name">
                        <h:outputText value="#{p.name}"/>
                    </p:column>
                    <p:column headerText="Surname">
                        <h:outputText value="#{p.surname}"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>
            <p:spacer/>
            <h:link outcome="orders" value="Orders search"/>
        </p:panel>
    </h:form>
</h:body>
</html>
